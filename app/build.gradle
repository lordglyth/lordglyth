plugins {
    id 'com.android.application'
}
android {
    namespace 'com.snoplay.blendcraft'
    compileSdk 36

    defaultConfig {
        applicationId 'com.snoplay.blendcraft'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '1.4.0'
    }

    // Keep Google Play checkout and SnoPlay checkout in distinct app editions.
    // In particular, the Play edition never advertises external PayPal checkout.
    flavorDimensions 'distribution'
    productFlavors {
        play {
            dimension 'distribution'
            applicationId 'com.snoplay.blendcraft'
            resValue 'string', 'app_name', 'BlendCraft'
            buildConfigField 'String', 'DISTRIBUTION', '"GOOGLE_PLAY"'
        }
        snoplay {
            dimension 'distribution'
            applicationId 'com.snoplay.blendcraft.snoplay'
            resValue 'string', 'app_name', 'BlendCraft SnoPlay'
            buildConfigField 'String', 'DISTRIBUTION', '"SNOPLAY"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Release keystore credentials must be supplied through the release runner's
    // protected environment. Never commit a key or passphrase to GitHub.
    def keyFilePath = System.getenv('BLENDCRAFT_KEYSTORE_PATH')
    def storeSecret = System.getenv('BLENDCRAFT_STORE_PASSWORD')
    def keyAliasName = System.getenv('BLENDCRAFT_KEY_ALIAS')
    def keySecret = System.getenv('BLENDCRAFT_KEY_PASSWORD')
    def signingReady = keyFilePath && storeSecret && keyAliasName && keySecret
    signingConfigs {
        production {
            storeType 'pkcs12'
            if (signingReady) {
                storeFile file(keyFilePath)
                storePassword storeSecret
                keyAlias keyAliasName
                keyPassword keySecret
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingReady) {
                signingConfig signingConfigs.production
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The Google Play edition alone includes the Play Billing client library.
// It will not start a transaction until a verified backend and in-app
// product are configured, avoiding any paid-but-locked purchases.
dependencies {
    playImplementation 'com.android.billingclient:billing:9.1.0'
}

// The Billing SDK pulls Kotlin libraries through multiple dependencies.
// Keep the stdlib family aligned to avoid duplicate runtime classes.
configurations.configureEach {
    resolutionStrategy.eachDependency { dep ->
        if (dep.requested.group == 'org.jetbrains.kotlin' &&
            dep.requested.name.startsWith('kotlin-stdlib')) {
            dep.useVersion '1.8.22'
            dep.because 'Avoid mixed legacy Kotlin standard libraries in Play Billing build'
        }
    }
}
