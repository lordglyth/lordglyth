name: Owner-only BlendCraft release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to create the two signed production packages'
        type: string
        required: true
permissions:
  contents: read
jobs:
  signed-release:
    if: github.actor == 'lordglyth' && inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    environment: blendcraft-production
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find Android SDK command line tools
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          "$SDKMGR" --version
      - name: Install Android API
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Recover release key from protected GitHub secret
        env:
          KEYSTORE_B64: ${{ secrets.BLENDCRAFT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Release keystore is not configured"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/blendcraft-release.jks"
          chmod 600 "$RUNNER_TEMP/blendcraft-release.jks"
          echo "BLENDCRAFT_KEYSTORE_PATH=$RUNNER_TEMP/blendcraft-release.jks" >> "$GITHUB_ENV"
      - name: Assemble signed SnoPlay APK and Play app bundle
        env:
          BLENDCRAFT_STORE_PASSWORD: ${{ secrets.BLENDCRAFT_STORE_PASSWORD }}
          BLENDCRAFT_KEY_ALIAS: ${{ secrets.BLENDCRAFT_KEY_ALIAS }}
          BLENDCRAFT_KEY_PASSWORD: ${{ secrets.BLENDCRAFT_KEY_PASSWORD }}
        run: |
          test -n "$BLENDCRAFT_STORE_PASSWORD"
          test -n "$BLENDCRAFT_KEY_ALIAS"
          test -n "$BLENDCRAFT_KEY_PASSWORD"
          gradle --no-daemon :app:assembleSnoplayRelease :app:bundlePlayRelease
      - name: Verify signed output packages
        run: |
          test -s app/build/outputs/apk/snoplay/release/app-snoplay-release.apk
          test -s app/build/outputs/bundle/playRelease/app-play-release.aab
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APK_SIGNER" verify --verbose app/build/outputs/apk/snoplay/release/app-snoplay-release.apk
      - name: Upload signed SnoPlay APK
        uses: actions/upload-artifact@v4
        with:
          name: BlendCraft-SnoPlay-signed-APK
          path: app/build/outputs/apk/snoplay/release/app-snoplay-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: BlendCraft-GooglePlay-AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/blendcraft-release.jks"
