name: Build BlendCraft APK and Play Bundle
on:
  push:
    branches: [blendcraft-android]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Compile Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          "$SDKMGR" --version
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run deterministic glitch algorithm tests
        run: |
          mkdir -p "$RUNNER_TEMP/glitch-tests"
          javac -d "$RUNNER_TEMP/glitch-tests" \
            tests/stub/android/graphics/Bitmap.java \
            app/src/main/java/com/snoplay/blendcraft/GlitchFx.java \
            app/src/main/java/com/snoplay/blendcraft/ExtraGlitches.java \
            tests/java/com/snoplay/blendcraft/GlitchFxTest.java
          java -cp "$RUNNER_TEMP/glitch-tests" com.snoplay.blendcraft.GlitchFxTest
      - name: Assemble free test editions
        run: gradle --no-daemon :app:assemblePlayDebug :app:assembleSnoplayDebug :app:bundlePlayRelease --stacktrace
      - name: Verify both APKs exist
        run: |
          test -s app/build/outputs/apk/play/debug/app-play-debug.apk
          test -s app/build/outputs/apk/snoplay/debug/app-snoplay-debug.apk
          test -s app/build/outputs/bundle/playRelease/app-play-release.aab
      - name: Publish test APKs
        uses: actions/upload-artifact@v4
        with:
          name: BlendCraft-v1.5-GlitchLab-Effects-Builds
          path: |
            app/build/outputs/apk/play/debug/app-play-debug.apk
            app/build/outputs/apk/snoplay/debug/app-snoplay-debug.apk
            app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 30
