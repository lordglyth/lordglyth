name: Build BlendCraft APK
on:
  push:
    branches: [blendcraft-android]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          "$SDKMGR" --version
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble free test editions
        run: gradle --no-daemon :app:assemblePlayDebug :app:assembleSnoplayDebug --stacktrace
      - name: Verify both APKs exist
        run: |
          test -s app/build/outputs/apk/play/debug/app-play-debug.apk
          test -s app/build/outputs/apk/snoplay/debug/app-snoplay-debug.apk
      - name: Publish test APKs
        uses: actions/upload-artifact@v4
        with:
          name: BlendCraft-1.3-free-test-apks
          path: |
            app/build/outputs/apk/play/debug/app-play-debug.apk
            app/build/outputs/apk/snoplay/debug/app-snoplay-debug.apk
          if-no-files-found: error
          retention-days: 30
