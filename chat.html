<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT HUD</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        input, button { margin: 10px; padding: 8px; font-size: 16px; }
        #response { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>ChatGPT HUD</h2>
    <input type="text" id="userInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
    <p id="response">Waiting for input...</p>

    <script>
        function sendMessage() {
            let userMessage = document.getElementById("userInput").value;
            fetch("YOUR_SERVER_URL", {  // Replace with your server to handle OpenAI API calls
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("response").innerText = "ChatGPT: " + data.reply;
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
